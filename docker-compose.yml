# Backends em container no servidor 192.168.0.99.
#
# ⚠️ Este é o deploy de PRODUÇÃO desde 2026-08-06. O PM2 do host (`api-gpprh`,
# `ws-gpprh`, `front-gpprh`) foi parado nessa data e o Apache aponta para os
# containers abaixo. `pm2 restart` no host não surte efeito — para aplicar
# mudança de código é `docker compose build && docker compose up -d`.
#
#   docker compose build
#   docker compose up -d
#   docker compose logs -f
#
# Portas (todas no loopback):
#   api-gipp-enterprises   127.0.0.1:4002   HTTP interno
#   ws-gipp-enterprises    127.0.0.1:4011   WebSocket (4001 dentro do container)
#   api-gpprh              127.0.0.1:4010   HTTP público (site de vagas)
#
# Diagnóstico: `docker compose ps` / `docker compose logs`, não `pm2 list`.
# (Há um PM2 vivo DENTRO do api-gipp-enterprises — o pm2-runtime do cluster
# mode, ver ecosystem.docker.config.js. Não confundir com o PM2 do host.)
#
# Todas publicadas SÓ no loopback: os containers ficam inalcançáveis pela rede,
# só o Apache do próprio host chega neles.

x-internal-env: &internal-env
  NODE_ENV: production

  # Fuso horário da operação.
  #
  # Container sem TZ roda em UTC, e o MySQL do `global` roda em horário LOCAL
  # (-03). A divergência quebrava tudo que compara data gerada no Node com
  # data do banco. Dois casos medidos em 16/09/2026:
  #
  #  - MIEPP: agendamento cadastrado para 12:10–13:15 era avaliado contra as
  #    15:12 UTC, então a janela "já tinha passado" e a playlist de prioridade
  #    menor (dia inteiro) tocava no lugar. Na prática a campanha ia ao ar das
  #    09:10 às 10:15.
  #  - Código de pareamento: `expires_at` é escrito pelo Node e comparado com
  #    `NOW()` do MySQL — o TTL de 10 minutos virava ~3h10min, enfraquecendo
  #    justamente a proteção do código de 8 dígitos.
  #
  # ⚠️ Exige `tzdata` na imagem. A base `node:*-slim` não traz o zoneinfo
  # completo, e sem ele esta variável é IGNORADA em silêncio — o processo
  # segue em UTC e nada no log indica o porquê. Já adicionado nos três
  # Dockerfiles; se trocar de imagem base, confira de novo.
  TZ: America/Sao_Paulo

  # `localhost:4001` (default do código) só funciona quando API e WS
  # compartilham o mesmo host/network namespace (caso do PM2). Em containers
  # separados, a API precisa alcançar o WS pelo nome do container na rede
  # Docker (resolução automática dentro de `api_default`), na porta INTERNA
  # do container (4001), não na porta publicada no host (4011).
  WS_EMIT_URL: http://ws-gipp-enterprises:4001/ws/emit-event

  # Refeitorio — reconhecimento facial. O servico nao publica porta: e alcancavel
  # so pela rede do compose, pelo nome `face`.
  FACE_SERVICE_URL: http://face:8000
  # IGUAL ao FACE_MAX_IMAGE_BYTES do servico face. Dois limites que discordam
  # fazem o 413 aparecer no lugar errado — foi o que aconteceu em 19/08/2026.
  FACE_MAX_IMAGE_BYTES: "12582912"

  # Oracle thick mode: o initOracleClient({libDir}) do config/oracle.js acha o
  # libclntsh.so, mas as dependências dele (libnnz19.so, libociei.so...) são
  # resolvidas pelo linker dinâmico, que só olha LD_LIBRARY_PATH e o cache do
  # ldconfig. No host há config de ldconfig para o Instant Client; a imagem não
  # herda isso, e rodar `ldconfig` no build não resolve porque o diretório só
  # aparece em runtime (é bind mount). Sem esta variável: DPI-1047.
  LD_LIBRARY_PATH: /opt/oracle/instantclient_19_27

  # `localhost` dentro do container é o container. O MySQL do banco `gpprh`
  # está no host. (Os pools `global` e `gipp` apontam para 10.10.10.99, que é
  # roteável normalmente pela bridge.)
  MYSQL_HOST: host.docker.internal

  # Par de segredos do lado INTERNO. Os valores ficam no .env (que está no
  # .gitignore) — este arquivo é versionado e não pode conter segredo.
  # Precisam ser DIFERENTES do par do api-gpprh: é isso que faz um token de
  # candidato deixar de ser verificável aqui.
  #
  # O `environment` tem precedência sobre o `env_file`, então o que vem daqui
  # vence o JWT_ACCESS_SECRET original do .env — sem mudança de código.
  JWT_ACCESS_SECRET: ${INTERNAL_JWT_ACCESS_SECRET:?defina INTERNAL_JWT_ACCESS_SECRET no .env}
  JWT_REFRESH_SECRET: ${INTERNAL_JWT_REFRESH_SECRET:?defina INTERNAL_JWT_REFRESH_SECRET no .env}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# `host.docker.internal` não existe por padrão no Docker em Linux. O
# host-gateway resolve para o IP da bridge, permitindo alcançar o MySQL do host.
x-extra-hosts: &extra-hosts
  - "host.docker.internal:host-gateway"

services:

  # ===========================================================================
  # Backend interno — HTTP (GTPP, EPP, GIPP-RH, Protheus, chat)
  # ===========================================================================
  api-gipp-enterprises:
    build:
      context: .
      dockerfile: Dockerfile.internal
    image: api-gipp-enterprises:local
    container_name: api-gipp-enterprises
    restart: unless-stopped

    ports:
      - "127.0.0.1:4002:4002"

    env_file: [.env]
    environment:
      <<: *internal-env
      PORT_INTERNAL: 4002

    volumes:
      # Oracle Instant Client do host, somente leitura. Deliberadamente NÃO
      # embutido na imagem: garante que é exatamente o client 19.27 que já
      # funciona hoje, sem risco de a versão baixada se comportar diferente.
      # Se um dia o app mudar de servidor, aí sim vale embutir.
      - /opt/oracle/instantclient_19_27:/opt/oracle/instantclient_19_27:ro
      # Estado em disco — anexos de chat e arquivos de módulos
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      # Trilha de auditoria em CSV do fechamento de jornada (GIPP). Mount
      # próprio, separado de `storage/`: log operacional e anexo de usuário têm
      # ciclos de backup e limpeza diferentes.
      - ./logs:/app/logs

    # Contém o vazamento do Chromium (~800MB de processos órfãos hoje). O
    # max_memory_restart do PM2 não pega isso porque o Chromium é processo-filho.
    # Espaço para 2 workers (1G cada) + picos do Chromium, com folga.
    mem_limit: 4g

    # O Puppeteer já usa --disable-dev-shm-usage, então isto é só seguro extra.
    shm_size: 256m

    extra_hosts: *extra-hosts
    logging: *logging

  # ===========================================================================
  # Backend interno — WebSocket (mesma imagem, só o comando muda)
  # ===========================================================================
  ws-gipp-enterprises:
    # Reusa a imagem construída pelo api-gipp-enterprises — NÃO declare `build`
    # aqui. Com `build` nos dois serviços e a mesma tag, o Compose constrói em
    # paralelo e ambos tentam gravar a tag ao mesmo tempo:
    #   failed to solve: image "api-gipp-enterprises:local": already exists
    image: api-gipp-enterprises:local
    pull_policy: never   # a imagem é local; nunca tentar buscar no Docker Hub
    depends_on: [api-gipp-enterprises]
    container_name: ws-gipp-enterprises
    restart: unless-stopped

    # A porta é fixa 4001 no código (websocketServer.js:204). Publicamos em
    # 4011 no host para não colidir com o ws-gpprh do PM2.
    ports:
      - "127.0.0.1:4011:4001"

    env_file: [.env]
    environment: *internal-env

    volumes:
      - /opt/oracle/instantclient_19_27:/opt/oracle/instantclient_19_27:ro
      - ./uploads:/app/uploads
      - ./storage:/app/storage

    mem_limit: 1g
    extra_hosts: *extra-hosts
    logging: *logging

    command: ["node", "src/websocket/websocketServer.js"]

  # ===========================================================================
  # Transcodificação de vídeo — converte anexos para H.264/MP4
  # ===========================================================================
  #
  # Imagem própria (Dockerfile.transcoder) porque carrega ffmpeg. Não entra no
  # Dockerfile.internal, que é compartilhado com o WebSocket.
  #
  # ⚠️ UMA instância, sempre. O worker reserva job com FOR UPDATE SKIP LOCKED, o
  #    que já suportaria concorrência, mas antes de subir réplica é preciso medir
  #    a CPU do servidor — não há aceleração por hardware aqui, e dois ffmpeg
  #    simultâneos disputam os mesmos núcleos que a API usa.
  #
  # Sem porta publicada: não atende requisição, só consome a fila do MySQL.
  transcoder:
    build:
      context: .
      dockerfile: Dockerfile.transcoder
    image: video-transcoder:local
    container_name: video-transcoder
    restart: unless-stopped
    depends_on: [api-gipp-enterprises]

    env_file: [.env]
    environment:
      NODE_ENV: production
      # Mesmo fuso do backend interno — ver o comentário em x-internal-env.
      TZ: America/Sao_Paulo
      MYSQL_HOST: host.docker.internal
      # Precisa apontar para o container do WS pelo nome na rede do compose —
      # `localhost` aqui seria o próprio transcoder.
      WS_EMIT_URL: http://ws-gipp-enterprises:4001/ws/emit-event
      # Qualidade alvo. 26/1280 ≈ 10-15 MB por minuto; use CRF 23 se for preciso
      # ler etiqueta de produto no vídeo (arquivo ~2x maior).
      VIDEO_TARGET_CRF: "26"
      VIDEO_TARGET_WIDTH: "1280"

    volumes:
      # Mesmo bind mount do backend interno: é onde os vídeos a converter estão.
      # Precisa ser leitura E escrita — o worker grava a saída e apaga o original.
      - ./storage:/app/storage

    # Um ffmpeg em 720p cabe folgado nisto. O limite existe para o worker não
    # competir por memória com os 2 workers da API no mesmo host.
    mem_limit: 1g

    extra_hosts: *extra-hosts
    logging: *logging

  # ===========================================================================
  # Backend público — site de vagas (candidatos)
  # ===========================================================================
  api-gpprh:
    build:
      context: .
      dockerfile: Dockerfile.public
    image: api-gpprh:local
    container_name: api-gpprh
    restart: unless-stopped

    ports:
      - "127.0.0.1:4010:4010"

    env_file: [.env]
    environment:
      NODE_ENV: production
      # Mesmo fuso do backend interno — ver o comentário em x-internal-env.
      TZ: America/Sao_Paulo
      PORT_PUBLIC: 4010
      MYSQL_HOST: host.docker.internal

      # Par de segredos do lado PÚBLICO — DIFERENTE do interno. Valores no .env.
      JWT_ACCESS_SECRET: ${PUBLIC_JWT_ACCESS_SECRET:?defina PUBLIC_JWT_ACCESS_SECRET no .env}
      JWT_REFRESH_SECRET: ${PUBLIC_JWT_REFRESH_SECRET:?defina PUBLIC_JWT_REFRESH_SECRET no .env}

    mem_limit: 512m
    extra_hosts: *extra-hosts
    logging: *logging

  # ===========================================================================
  # Reconhecimento facial do refeitório — etapa 6
  # ===========================================================================
  #
  # ⚠️ NÃO declara `ports:`, e isso é a decisão de segurança, não esquecimento.
  #   Sem porta publicada o serviço não é alcançável do host nem da rede — só de
  #   dentro da rede do compose, pelo nome `face`. É mais restrito que publicar
  #   em 127.0.0.1, e o vetor nunca sai da máquina.
  #
  #   Quem fala com ele é o api-gipp-enterprises, em `http://face:8000`.
  #
  # O build baixa ~330 MB de modelo e compila extensões C++ — leva alguns
  # minutos na primeira vez e a imagem fica em torno de 1,5 GB. Depois disso o
  # container sobe offline, o que é o ponto: um restart sem internet não pode
  # deixar o refeitório sem reconhecimento.
  face:
    build:
      context: ./face
      dockerfile: Dockerfile
      args:
        # Trocar aqui exige trocar FACE_MODEL_PACK abaixo E recadastrar os
        # rostos: o model_tag muda, e vetores de modelos diferentes não se
        # comparam (ver CK do meal_biometric e a rota /verify).
        MODEL_PACK: buffalo_l
    image: face-gipp-refeitorio:local
    container_name: face-gipp-refeitorio
    restart: unless-stopped

    environment:
      FACE_MODEL_PACK: buffalo_l
      FACE_MODEL_TAG: insightface-buffalo_l-w600k_r50
      # Confiança mínima do DETECTOR. Não é o limiar de identidade — esse é
      # calibrado no piloto e mora na API.
      FACE_MIN_DET_SCORE: "0.55"
      # Teto por imagem. Foto de camera de celular em resolucao cheia passa de 4 MB
      # com facilidade — 413 no /embed foi exatamente isso. Este valor tem que ser
      # IGUAL ao FACE_MAX_IMAGE_BYTES do api-gipp-enterprises: dois limites que
      # discordam fazem o erro aparecer no lugar errado.
      FACE_MAX_IMAGE_BYTES: "12582912"

    # Sem volume nenhum. O serviço não escreve em disco, e não ter volume torna
    # isso verificável em vez de prometido.
    read_only: true
    tmpfs:
      - /tmp:size=64m

    # ~700 MB por worker com o modelo carregado, mais folga.
    mem_limit: 2g

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    extra_hosts: *extra-hosts
    logging: *logging
